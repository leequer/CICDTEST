name: banksys-CI

# 多应用仓库：仅当 banksys 应用或本工作流发生变更时触发，只做 CI 不做 CD
on:
  push:
    branches: [main]
    paths:
      - "banksys/**"
      - ".github/workflows/banksys-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "banksys/**"

jobs:
  ci:
    name: 代码检查与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        # 多应用仓库隔离：所有命令在 banksys 子目录执行
        working-directory: banksys

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: banksys/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 代码格式检查（Black）
        run: black --check .

      - name: 代码风格检查（Ruff）
        run: ruff check .

      - name: 运行单元测试与覆盖率（pytest）
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80
